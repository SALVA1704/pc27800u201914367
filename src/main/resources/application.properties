spring.application.name=pc27800u201914367
# Server Configuration
server.port=8080

# DataSource Configuration (adjust database name, user and password)
spring.datasource.url=jdbc:mysql://localhost:3306/andes_logistics?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin

# Spring Data JPA Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
# Shared Spring DataSource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8

spring.jpa.hibernate.naming.physical-strategy=com.andeslogistics.platform.u201914367.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy